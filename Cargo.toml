[workspace]
resolver = "2"
members = ["crates/rustpad-core", "crates/rustpad-gtk"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "A dead simple, recoverable plain text editor"
repository = "https://github.com/tsubaie/RustPad"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
