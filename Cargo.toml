[workspace]
resolver = "3"
members = ["crates/rustxt-core", "crates/rustxt-iced"]
default-members = ["crates/rustxt-iced"]

[workspace.package]
version = "0.6.0"
edition = "2021"
# Minimum supported Rust: iced 0.14 requires 1.88, verified by the CI MSRV job.
# Resolver 3 makes `cargo update` respect it (uuid 1.28+ needs 1.89, for one).
rust-version = "1.88"
license = "MIT"
description = "A dead simple, recoverable plain text editor"
repository = "https://github.com/tsubaie/RusTXT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
iced_graphics = { path = "vendor/iced_graphics" }
iced_widget = { path = "vendor/iced_widget" }
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
