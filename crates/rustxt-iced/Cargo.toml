[package]
name = "rustxt-iced"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[dependencies]
rustxt-core = { path = "../rustxt-core" }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "advanced-shaping", "tokio", "x11", "wayland", "linux-theme-detection"] }
rfd = "0.16"
regex = "1"
chrono = "0.4"
fs2 = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
webbrowser = "1"

[dev-dependencies]
tempfile = "3"
iced_graphics = "0.14"
iced_core = "0.14"
