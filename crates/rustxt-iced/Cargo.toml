[package]
name = "rustxt-iced"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[dependencies]
rustxt-core = { path = "../rustxt-core" }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "svg", "advanced-shaping", "tokio", "x11", "wayland", "linux-theme-detection"] }
iced_graphics = "0.14"
unicode-script = "0.5"
rfd = "0.16"
regex = "1"
chrono = "0.4"
fs2 = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
webbrowser = "1"

[dev-dependencies]
tempfile = "3"
iced_core = "0.14"

# Debian/Ubuntu package (cargo-deb). Paths are relative to this manifest.
[package.metadata.deb]
name = "rustxt"
maintainer = "Talal A. Alsubaie <t.subaie@gmail.com>"
copyright = "2026, Talal A. Alsubaie"
license-file = ["../../LICENSE", "0"]
extended-description = """\
RusTXT is a dead simple, recoverable plain text editor: tabs that remember where you left off, unsaved work that survives a
crash, find and replace that stays out of the way. Built with Rust and Iced for Linux, Windows and macOS."""
section = "editors"
priority = "optional"
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libx11-6, libx11-xcb1, libxcursor1, libxi6, fontconfig"
recommends = "xdg-desktop-portal"
assets = [
  ["target/release/rustxt-iced", "usr/bin/rustxt", "755"],
  ["../../data/com.tsubaie.rustxt.desktop", "usr/share/applications/", "644"],
  ["../../data/icons/com.tsubaie.rustxt.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
  ["../../README.md", "usr/share/doc/rustxt/README.md", "644"],
]

# Fedora package (cargo-generate-rpm). Paths are relative to the workspace root.
[package.metadata.generate-rpm]
name = "rustxt"
summary = "Dead simple, recoverable text editor built with Rust and Iced"
license = "MIT"
url = "https://github.com/tsubaie/RusTXT"
assets = [
  { source = "target/release/rustxt-iced", dest = "/usr/bin/rustxt", mode = "755" },
  { source = "data/com.tsubaie.rustxt.desktop", dest = "/usr/share/applications/com.tsubaie.rustxt.desktop", mode = "644" },
  { source = "data/icons/com.tsubaie.rustxt.png", dest = "/usr/share/icons/hicolor/512x512/apps/com.tsubaie.rustxt.png", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/licenses/rustxt/LICENSE", mode = "644", doc = true },
  { source = "README.md", dest = "/usr/share/doc/rustxt/README.md", mode = "644", doc = true },
]

# These libraries are loaded dynamically, so automatic ELF scanning misses them.
[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
libxkbcommon-x11 = "*"
wayland-libs = "*"
libX11 = "*"
libXcursor = "*"
libXi = "*"
fontconfig = "*"

[package.metadata.generate-rpm.recommends]
xdg-desktop-portal = "*"
