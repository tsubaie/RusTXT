[package]
name = "rustpad"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[[bin]]
name = "rustpad"
path = "src/main.rs"

[dependencies]
rustpad-core = { path = "../rustpad-core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
sourceview5 = "0.11"
async-channel = "2"

# Debian/Ubuntu package (cargo-deb). Paths are relative to this manifest.
[package.metadata.deb]
name = "rustpad"
maintainer = "Talal A. Alsubaie <t.subaie@gmail.com>"
copyright = "2026, Talal A. Alsubaie"
license-file = ["../../LICENSE", "0"]
extended-description = """\
RustPad is a dead simple, recoverable plain text editor: tabs that remember where you left off, unsaved work that survives a
crash, find and replace that stays out of the way. Built with GTK 4,
libadwaita and GtkSourceView."""
section = "editors"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/rustpad", "usr/bin/", "755"],
  ["../../data/com.tsubaie.rustpad.desktop", "usr/share/applications/", "644"],
  ["../../data/icons/com.tsubaie.rustpad.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["../../README.md", "usr/share/doc/rustpad/README.md", "644"],
]

# Fedora package (cargo-generate-rpm). Paths are relative to the workspace root.
[package.metadata.generate-rpm]
name = "rustpad"
summary = "Dead simple, recoverable text editor built with GTK 4 and libadwaita"
license = "MIT"
url = "https://github.com/tsubaie/RustPad"
assets = [
  { source = "target/release/rustpad", dest = "/usr/bin/rustpad", mode = "755" },
  { source = "data/com.tsubaie.rustpad.desktop", dest = "/usr/share/applications/com.tsubaie.rustpad.desktop", mode = "644" },
  { source = "data/icons/com.tsubaie.rustpad.svg", dest = "/usr/share/icons/hicolor/scalable/apps/com.tsubaie.rustpad.svg", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/licenses/rustpad/LICENSE", mode = "644", doc = true },
  { source = "README.md", dest = "/usr/share/doc/rustpad/README.md", mode = "644", doc = true },
]
