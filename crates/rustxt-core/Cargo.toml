[package]
name = "rustxt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Toolkit-independent core of RusTXT: documents, recovery storage, configuration, themes"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
notify = "8"
serde_json = "1"
semver = "1"
sha2 = "0.10"
