[package]
name = "rustpad-core"
version.workspace = true
edition.workspace = true
description = "Toolkit-independent core of RustPad: documents, recovery storage, configuration, themes"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
notify = "8"
