name: CI

# Skipped for documentation-only changes; the release workflow builds the
# packages, so this only has to prove the tree formats, tests and builds.
on:
  push:
    branches: [main, 'feat/iced-*']
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test and build (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install toolchain and desktop libraries
        run: pacman -Syu --noconfirm rust libxkbcommon libxkbcommon-x11 wayland libx11 libxcursor libxi fontconfig git
      - uses: actions/checkout@v4
      # Shared with the release workflow's Arch job: same image, same compiler.
      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arch-linux
          cache-on-failure: true
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p rustxt-core -p rustxt-iced --all-targets --locked -- -D warnings
      - name: Tests
        run: |
          cargo test -p rustxt-core -p rustxt-iced --locked
          cargo test -p iced_tiny_skia --lib --locked
      - name: Release build
        run: cargo build --release --locked -p rustxt-iced
