name: CI

# Skipped for documentation-only changes; the release workflow builds the
# packages, so this only has to prove the tree formats, lints, tests and runs.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:
    inputs:
      update_goldens:
        description: "Regenerate tools/goldens on this runner and upload them as the goldens artifact"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    # Runs the Makefile verbatim, so the pre-push hook, `make check` and CI are
    # one definition of the gates: fmt, clippy, tests, renderer regression.
    name: make check and end-to-end (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      # Xvfb, xdotool, ImageMagick and a font let the end-to-end tests open and
      # inspect real windows.
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libfontconfig1-dev libx11-dev libx11-xcb1 libxcursor1 libxrandr-dev libxi-dev xvfb xdotool imagemagick fonts-noto-core fonts-dejavu-core
      - name: make check
        run: make check
      - name: Real window, recovery, rendering and regression tests
        run: make e2e
      # The goldens are made on this image (tools/goldens/README.md), so they
      # are compared only here, and only once some have been committed.
      - name: Golden screenshots
        if: ${{ !inputs.update_goldens }}
        run: |
          if ls tools/goldens/*.png >/dev/null 2>&1; then
            make goldens
          else
            echo "No golden screenshots committed; skipping the comparison."
          fi
      - name: Regenerate golden screenshots
        if: ${{ inputs.update_goldens }}
        run: make goldens-update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.update_goldens }}
        with:
          name: goldens
          path: tools/goldens
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: iced-ui-failure
          path: |
            target/iced-e2e
            target/iced-rendering-e2e
            target/iced-regressions
            target/iced-golden

  smoke:
    name: Smoke ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      # The same commands as the Makefile's clippy and test targets.
      - name: Clippy
        run: cargo clippy -p rustxt-core -p rustxt-iced --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test -p rustxt-core -p rustxt-iced --locked
      - name: Renderer redraw regression
        run: cargo test -p iced_tiny_skia --lib --locked
      - name: Release build
        run: cargo build --release --locked -p rustxt-iced
      - name: Native startup smoke test
        run: python tools/iced-startup-smoke.py target/release

  msrv:
    # The floor declared as rust-version in Cargo.toml must keep compiling.
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-22.04
    env:
      # Overrides rust-toolchain.toml for every cargo call in this job.
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libfontconfig1-dev libx11-dev libx11-xcb1 libxcursor1 libxrandr-dev libxi-dev
      - name: Cargo.toml declares the version this job tests
        run: grep -qx 'rust-version = "1.88"' Cargo.toml
      - name: Check with the minimum supported Rust
        run: cargo check -p rustxt-core -p rustxt-iced --locked

  deny:
    # Advisories, licenses, duplicate versions and registry sources; deny.toml.
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked
