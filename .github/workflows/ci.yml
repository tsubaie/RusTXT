name: CI

# Skipped for documentation-only changes; the release workflow builds the
# packages, so this only has to prove the tree formats, tests and builds.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test and build (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # Xvfb and a font give the end-to-end tests a display to open windows on.
      - name: Install toolchain, GTK and a headless display
        run: pacman -Syu --noconfirm rust gtk4 libadwaita gtksourceview5 git xorg-server-xvfb ttf-dejavu
      - uses: actions/checkout@v4
      # Shared with the release workflow's Arch job: same image, same compiler.
      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arch-linux
          cache-on-failure: true
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo test --workspace --locked
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
      - name: Release build
        run: cargo build --release --locked -p rustxt
