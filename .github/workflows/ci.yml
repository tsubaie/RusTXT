name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and build (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install toolchain and GTK
        run: pacman -Syu --noconfirm rust gtk4 libadwaita gtksourceview5 git
      - uses: actions/checkout@v4
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p rustpad
