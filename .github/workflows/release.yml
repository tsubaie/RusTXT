name: Release

# Push a tag like v0.5.0 to build native packages and publish a GitHub Release.
# A manual run builds and smoke-tests everything without publishing.
on:
  push:
    # Only release versions; archival tags such as v0.4.1-gtk must not start a build.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

# Read-only by default; only the publishing job asks for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: Tag must match the Cargo version and have release notes
        id: version
        run: |
          set -eu
          cargo_version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "rustxt-iced") | .version')"
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            test "$tag_version" = "$cargo_version" || {
              echo "Tag version $tag_version does not match Cargo version $cargo_version" >&2
              exit 1
            }
          fi
          notes="docs/releases/$cargo_version.md"
          test -f "$notes" || {
            echo "Release notes $notes are missing; the release body is read from there" >&2
            exit 1
          }

  # Every packaging job writes <artifact>.sha256 next to what it built, so the
  # release job assembles SHA256SUMS from the producers' own hashes and verifies
  # the downloaded artifacts against them instead of hashing them again.
  arch:
    name: Arch package
    runs-on: ubuntu-latest
    needs: validate
    container: archlinux:base-devel
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Install desktop libraries
        run: pacman -Syu --noconfirm libxkbcommon libxkbcommon-x11 wayland libx11 libxcursor libxi fontconfig git sudo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Build
        run: cargo build --release --locked -p rustxt-iced
      # makepkg refuses to run as root and would rebuild from scratch in its own
      # cargo home, so build above with the cache and let it only package (-R).
      # -d: cargo comes from rustup, not pacman, so skip the makedepends check.
      - name: Package for Arch
        run: |
          useradd -m builder
          chown -R builder .
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD
          cd packaging/arch
          sudo -u builder makepkg -Rfd --noconfirm
      - name: Collect and checksum
        run: |
          mkdir -p dist && cp packaging/arch/*.pkg.tar.zst dist/
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch
          path: dist/*

  deb:
    name: Debian package
    runs-on: ubuntu-latest
    needs: validate
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential curl ca-certificates pkg-config dpkg-dev git \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libfontconfig1-dev libx11-dev libx11-xcb1 libxcursor1 libxrandr-dev libxi-dev
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo registry, build output and cargo-deb
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      # Prebuilt binary when one exists, otherwise a source build; either way the
      # result lands in ~/.cargo/bin and is cached for the next release.
      - uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
      - name: Install cargo-deb
        run: cargo binstall -y --locked cargo-deb
      - name: Build .deb
        run: |
          cargo deb -p rustxt-iced --locked
          mkdir -p dist && cp target/debian/*.deb dist/
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/*

  rpm:
    name: Fedora package
    runs-on: ubuntu-latest
    needs: validate
    container: fedora:42
    steps:
      - name: Install build dependencies
        run: dnf install -y gcc pkgconf-pkg-config curl git rpm-build libxkbcommon-devel wayland-devel fontconfig-devel libX11-devel libXrandr-devel libXi-devel
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo registry, build output and cargo-generate-rpm
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
      - name: Install cargo-generate-rpm
        run: cargo binstall -y --locked cargo-generate-rpm
      - name: Build .rpm
        run: |
          cargo build --release --locked -p rustxt-iced
          cargo generate-rpm -p crates/rustxt-iced
          mkdir -p dist && cp target/generate-rpm/*.rpm dist/
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm
          path: dist/*

  native:
    name: Native ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libfontconfig1-dev libx11-dev libx11-xcb1 libxcursor1 libxrandr-dev libxi-dev xvfb xdotool imagemagick fonts-noto-core
      - name: Tests
        run: cargo test --locked -p rustxt-core -p rustxt-iced
      - name: Renderer regression
        run: cargo test --locked -p iced_tiny_skia --lib
      - name: Build Iced
        if: runner.os != 'Linux'
        run: cargo build --release --locked -p rustxt-iced
      # Linux keeps the symbols out of the shipped binary but publishes them as
      # rustxt-<version>-x86_64-linux.debug so crash backtraces from the tarball
      # can be symbolised (gdb and eu-stack find it via the build id/debuglink).
      # The deb, rpm and Arch packages are separate builds of the same source
      # and do not match this .debug file.
      - name: Build Iced with line tables, split the symbols out
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p rustxt-iced --config profile.release.strip=false --config 'profile.release.debug="line-tables-only"'
          mkdir -p dist
          objcopy --only-keep-debug --compress-debug-sections=zlib target/release/rustxt-iced "dist/rustxt-$VERSION-x86_64-linux.debug"
          objcopy --strip-all --add-gnu-debuglink="dist/rustxt-$VERSION-x86_64-linux.debug" target/release/rustxt-iced target/release/rustxt-iced
      - name: Native startup smoke test
        if: runner.os != 'Linux'
        run: python tools/iced-startup-smoke.py target/release
      - name: Linux end-to-end tests
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' python3 tools/iced-e2e.py target/release/rustxt-iced target/iced-e2e
          xvfb-run -a -s '-screen 0 1600x1200x24' python3 tools/iced-rendering-e2e.py target/release/rustxt-iced target/iced-rendering-e2e
      - name: Linux tarball
        if: runner.os == 'Linux'
        run: |
          dir="rustxt-$VERSION"
          mkdir -p "dist/$dir"
          cp target/release/rustxt-iced "dist/$dir/rustxt"
          cp data/com.tsubaie.rustxt.desktop data/icons/com.tsubaie.rustxt.png LICENSE README.md packaging/tarball/install.sh "dist/$dir/"
          tar -C dist -czf "dist/rustxt-$VERSION-x86_64-linux.tar.gz" "$dir"
      - name: macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/RusTXT.app/Contents/MacOS dist/RusTXT.app/Contents/Resources
          cp target/release/rustxt-iced dist/RusTXT.app/Contents/MacOS/rustxt
          cp packaging/macos/Info.plist dist/RusTXT.app/Contents/
          mkdir -p target/RusTXT.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" data/icons/com.tsubaie.rustxt.png --out "target/RusTXT.iconset/icon_${size}x${size}.png"
          done
          iconutil -c icns target/RusTXT.iconset -o dist/RusTXT.app/Contents/Resources/RusTXT.icns
          codesign --force --deep --sign - dist/RusTXT.app
          codesign --verify --deep --strict dist/RusTXT.app
          ditto -c -k --sequesterRsrc --keepParent dist/RusTXT.app "dist/rustxt-$VERSION-$(uname -m)-macos.zip"
      - name: Windows portable application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:VERSION
          New-Item -ItemType Directory -Force dist/rustxt
          Copy-Item target/release/rustxt-iced.exe dist/rustxt/rustxt.exe
          Copy-Item LICENSE,README.md dist/rustxt/
          Compress-Archive dist/rustxt/* "dist/rustxt-$version-x86_64-windows.zip"
      # Same "<sha256>  <name>" lines sha256sum -c and install.sh read.
      - name: Checksums
        if: runner.os != 'Windows'
        run: |
          cd dist
          for f in *.tar.gz *.zip *.debug; do
            [ -e "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
      - name: Checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist -File -Filter *.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$($_.FullName).sha256", "$hash  $($_.Name)`n")
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.debug
            dist/*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && runner.os == 'Linux'
        with:
          name: release-e2e-failure
          path: |
            target/iced-e2e
            target/iced-rendering-e2e

  package-smoke:
    name: Installed package on ${{ matrix.package }}
    if: always() && !cancelled()
    needs: [arch, deb, rpm]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: arch
            image: archlinux:base
            install: pacman -Syu --noconfirm xorg-server-xvfb xorg-xauth python ttf-dejavu && pacman -U --noconfirm /packages/*.pkg.tar.zst
          - package: deb
            image: debian:trixie
            install: apt-get update && apt-get install -y --no-install-recommends xvfb xauth python3 fonts-dejavu-core /packages/*.deb
          - package: rpm
            image: fedora:42
            install: dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth python3 dejavu-sans-fonts /packages/*.rpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.package }}
          path: packages
      - name: Install and start packaged application
        env:
          IMAGE: ${{ matrix.image }}
          INSTALL: ${{ matrix.install }}
        run: |
          docker run --init --rm -v "$PWD/packages:/packages:ro" -v "$PWD/tools:/tests:ro" "$IMAGE" \
            bash -c "$INSTALL && xvfb-run -a python3 /tests/iced-startup-smoke.py /usr/bin/rustxt"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, arch, deb, rpm, native, package-smoke]
    runs-on: ubuntu-latest
    # The only job that writes: the release itself, plus the OIDC token and
    # attestation store for the build provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # SHA256SUMS is the producers' .sha256 files concatenated (PKGBUILD is
      # generated here, so it is the one entry hashed on this runner), then
      # every download is verified against it before anything is published.
      - name: Assemble SHA256SUMS and the AUR recipe
        run: |
          set -eu
          cd dist
          cat ./*.sha256 | LC_ALL=C sort -k2 > SHA256SUMS
          rm ./*.sha256
          sha="$(grep " rustxt-$VERSION-x86_64-linux.tar.gz\$" SHA256SUMS | cut -d' ' -f1)"
          test -n "$sha"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sha/" ../packaging/aur/rustxt-bin/PKGBUILD > PKGBUILD
          sha256sum PKGBUILD >> SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -la
      - name: Build provenance for every release asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          body_path: docs/releases/${{ needs.validate.outputs.version }}.md
