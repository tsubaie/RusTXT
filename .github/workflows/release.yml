name: Release

# Push a tag like v0.2.0 to build native packages and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo package version
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rustxt") | .version')"
          test "$tag_version" = "$cargo_version" || {
            echo "Tag version $tag_version does not match Cargo version $cargo_version" >&2
            exit 1
          }

  arch:
    name: Arch package and tarball
    runs-on: ubuntu-latest
    needs: validate
    container: archlinux:base-devel
    steps:
      - name: Install toolchain and GTK
        run: pacman -Syu --noconfirm rust gtk4 libadwaita gtksourceview5 git sudo
      - uses: actions/checkout@v4
      # Restores the cache CI keeps warm on main, so this is usually a link step.
      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arch-linux
          cache-on-failure: true
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p rustxt
      # makepkg refuses to run as root and would rebuild from scratch in its own
      # cargo home, so build above with the cache and let it only package (-R).
      - name: Package for Arch
        run: |
          useradd -m builder
          chown -R builder .
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD
          cd packaging/arch
          sudo -u builder makepkg -Rf --noconfirm
      - name: Build tarball
        run: |
          set -eu
          dir="rustxt-$VERSION"
          mkdir -p "dist/$dir"
          cp target/release/rustxt data/com.tsubaie.rustxt.desktop data/icons/com.tsubaie.rustxt.png LICENSE README.md packaging/tarball/install.sh "dist/$dir/"
          tar -C dist -czf "dist/rustxt-$VERSION-x86_64-linux.tar.gz" "$dir"
          rm -r "dist/$dir"
          mv packaging/arch/*.pkg.tar.zst dist/
          sha=$(sha256sum "dist/rustxt-$VERSION-x86_64-linux.tar.gz" | cut -d' ' -f1)
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sha/" packaging/aur/rustxt-bin/PKGBUILD > dist/PKGBUILD
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*

  deb:
    name: Debian package
    runs-on: ubuntu-latest
    needs: validate
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential curl ca-certificates pkg-config dpkg-dev git \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v4
      - name: Cache cargo registry, build output and cargo-deb
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Prebuilt binary when one exists, otherwise a source build; either way the
      # result lands in ~/.cargo/bin and is cached for the next release.
      - uses: cargo-bins/cargo-binstall@9ef12faecb70a6811561bc924b14c09230a9b77e
      - name: Install cargo-deb
        run: cargo binstall -y --locked cargo-deb
      - name: Build .deb
        run: |
          cargo deb -p rustxt --locked
          mkdir -p dist && cp target/debian/*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*

  rpm:
    name: Fedora package
    runs-on: ubuntu-latest
    needs: validate
    container: fedora:42
    steps:
      - name: Install build dependencies
        run: dnf install -y gcc pkgconf-pkg-config curl git rpm-build gtk4-devel libadwaita-devel gtksourceview5-devel
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v4
      - name: Cache cargo registry, build output and cargo-generate-rpm
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: cargo-bins/cargo-binstall@9ef12faecb70a6811561bc924b14c09230a9b77e
      - name: Install cargo-generate-rpm
        run: cargo binstall -y --locked cargo-generate-rpm
      - name: Build .rpm
        run: |
          cargo build --release --locked -p rustxt
          cargo generate-rpm -p crates/rustxt-gtk
          mkdir -p dist && cp target/generate-rpm/*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [arch, deb, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            | Distro | Command |
            |---|---|
            | Arch / Omarchy | `sudo pacman -U rustxt-*.pkg.tar.zst` |
            | Debian 13+ / Ubuntu 25.04+ | `sudo apt install ./rustxt_*_amd64.deb` |
            | Fedora 42+ | `sudo dnf install ./rustxt-*.x86_64.rpm` |
            | Any Linux | extract the `.tar.gz` and run `./install.sh` |

            RusTXT needs GTK 4.16, libadwaita 1.6 and GtkSourceView 5 or newer.
            Verify downloads against `SHA256SUMS`.
